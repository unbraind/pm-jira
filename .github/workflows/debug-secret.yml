name: Debug Secret
on: { workflow_dispatch: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - name: Inspect token (no secret exposure)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "token length: ${#NODE_AUTH_TOKEN}"
          echo "starts_with_npm: $(case "$NODE_AUTH_TOKEN" in npm_*) echo yes;; *) echo no;; esac)"
          echo "whoami:"; npm whoami || echo "WHOAMI FAILED"
