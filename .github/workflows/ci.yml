name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PM_TEST_DEPTH: quick
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Detect code changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          code=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            code=false
            git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/ci-changed-paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                .agents/pm/*.mjs|.agents/pm/*.cjs|.agents/pm/*.js|.agents/pm/*.ts) code=true ;;
                .agents/pm/*|*.md|docs/*|CHANGELOG.md|LICENSE) ;;
                *) code=true ;;
              esac
            done < "$RUNNER_TEMP/ci-changed-paths"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Setup Bun
        if: steps.changes.outputs.code == 'true'
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install dependencies
        run: npm ci

      - name: Install project pm-github extension
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/pm package install npm:pm-github@2026.10.4 --project
          node -e 'if (require("./.agents/pm/extensions/pm-github/package.json").version !== "2026.10.4") process.exit(1)'
          managed_registry=".agents/pm/extensions/.managed-extensions.json"
          if git ls-files --error-unmatch "${managed_registry}" > /dev/null 2>&1; then
            git restore -- "${managed_registry}"
          else
            rm -f "${managed_registry}"
          fi

      - name: Verify tracked pm project health
        shell: bash
        run: |
          set -euo pipefail
          # Catch durable checkout-visible failures: conflict markers, parse failures,
          # invalid or drifted history, tracked runtime caches, extension health,
          # stale in-progress work, and any merge evidence present in this clone.
          #
          # This is not a lossless-merge attestation. Merge receipts are clone-local and
          # absent from a fresh CI checkout. Some unreconciled loss shapes surface as
          # history drift, but reconciliation or history repair can remove that signal.
          # Keep receipt review as a local pre-push step; pm-cli#921 and pm-cli#922 track
          # the missing durable proof.
          #
          # `--strict-exit` is load-bearing: non-strict health may report findings while
          # still exiting successfully.
          ./node_modules/.bin/pm health --strict-exit --require-merge-drivers


      - name: Build and verify committed output is current
        if: steps.changes.outputs.code == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch 'dist/' > /dev/null 2>&1; then
            echo "::error::dist/ is not tracked. This package is installed by copying the repository, so the build output has to be in git."
            exit 1
          fi
          rm -rf dist
          npm run build
          drift=$(git status --porcelain=v1 --untracked-files=all --ignored=matching -- 'dist/')
          if [ -n "$drift" ]; then
            echo "::error::Committed dist/ does not match a fresh build. Run 'npm run build' and commit the result."
            printf '%s\n' "$drift"
            exit 1
          fi
          echo "Committed dist/ matches a fresh build."

      - name: Compare SDK adoption with the base build
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 26
        env:
          PM_JIRA_BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/sdk-adoption-differential.ts

      - name: Verify complete docstring coverage
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 26
        run: npm run docstring

      # Keep both complete gates on CI runners; local validation is targeted.
      - name: Documentation, tracker and public identity gates
        if: steps.changes.outputs.code != 'true'
        run: |
          npm run changelog:check
          npm run verify:release-changelog-date
          npm run verify:release-publish-attestation
          npm run pack:dry-run
          node --test --test-concurrency=2 test/identity-audit.test.ts test/jql-selection.test.ts test/adf-evidence-command.test.ts

      - name: Engines floor build and tests
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 22
        run: npm test

      - name: Quick npm release gate
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 26
        run: npm run release:check

      - name: Bun package graph and bunx smoke
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 26
        run: |
          bun install --no-save
          bunx --no-install pm --version
